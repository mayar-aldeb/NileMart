<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nile Mart</title>
</head>
<body>
<style>
    .field {
        margin-bottom: 15px;
    }
</style>

<div class="field">
    <label for="mainMenu">Main Menu</label>
    <select id="mainMenu" onchange="if(this.value) window.location.href=this.value">
        <option value="" selected disabled>Select a page</option>
        <option th:value="@{/products}">Products</option>
        <option th:value="@{/brands}">Brands</option>
        <option th:value="@{/categories}">Categories</option>
    </select>
</div>

<form th:action="@{/products}" th:object ="${product}" method="post">
    <div class="field">
        <label>SKU      <input  th:field ="*{sku}"></label>
        <span th:if="${#fields.hasErrors('sku')}" th:errors ="*{sku}"></span>
    </div>
    <div class="field">
        <label>Name     <input  th:field ="*{name}"></label>
        <span th:if="${#fields.hasErrors('name')}" th:errors ="*{name}"></span>
    </div>
    <div class="field">
        <label>Brand</label>
        <select th:field="*{brandSlug}">
            <option value="">No Brand</option>
            <option th:each="brand : ${brands}"
                    th:value="${brand.slug}"
                    th:text="${brand.name}">
            </option>
        </select>
        <span th:if="${#fields.hasErrors('brandSlug')}" th:errors ="*{brandSlug}"></span>
    </div>
    <div class="field">
        <label>Category</label>
        <select th:field="*{categorySlug}">
            <option th:each="category : ${categories}"
                    th:value="${category.slug}"
                    th:text="${category.name}">
            </option>
        </select>
        <span th:if="${#fields.hasErrors('categorySlug')}" th:errors ="*{categorySlug}"></span>
    </div>

    <div class="field">
        <label>Price    <input  th:field ="*{price}"></label>
        <span th:if="${#fields.hasErrors('price')}" th:errors ="*{price}"></span>
    </div>
    <div class="field">
        <label>Stock    <input  th:field ="*{inStock}"></label>
        <span th:if="${#fields.hasErrors('inStock')}" th:errors ="*{inStock}"></span>
    </div>
    <button type="submit">Save product</button>
</form>
<a  th:href="@{/products}">Back to products</a>


</body>
</html>
