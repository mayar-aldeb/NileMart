<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart</title>

    <style>
        .center-container {
            display: flex;
        }

        .add-button {
            font-size: 20px;
            padding: 20px 50px;
            background-color: #333333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .add-button:hover {
            background-color: #0056b3;
        }
    </style>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
<label for="mainMenu">Main Menu</label>

<select id="mainMenu" onchange="if(this.value) window.location.href=this.value">
    <option value="" selected disabled>Select a page</option>
    <option th:value="@{/brands}">Brands</option>
    <option th:value="@{/products}">Products</option>
</select>
<h1>Available categories</h1>
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Parent slug</th>
        <th>Order</th>
        <th>Active</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="category : ${categories}">
        <td th:text="${!category.parentSlug.isEmpty() ? '-- '+ category.name :category.name}"></td>
        <td th:text="${category.slug}"></td>
        <td th:text="${category.parentSlug.isEmpty() ? '----' : category.parentSlug }"></td>
        <td th:text="${category.order}"></td>
        <td th:text="${category.active ? 'Yes' : 'No'}"></td>
    </tr>
    </tbody>
</table>
<div class="center-container">
    <a th:href="@{/categories/new}" class="add-button">
        Add Category
    </a>
</div>
</body>
</html>
