<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nile Mart</title>
</head>
<body>
<style>
    .field {
        margin-bottom: 15px;
    }
</style>
<div class="field">
    <label for="mainMenu">Main Menu</label>
    <select id="mainMenu" onchange="if(this.value) window.location.href=this.value">
        <option value="" selected disabled>Select a page</option>
        <option th:value="@{/products}">Products</option>
        <option th:value="@{/brands}">Brands</option>
        <option th:value="@{/categories}">Categories</option>
    </select>
</div>
<form th:action="@{/brands}" th:object ="${brand}" method="post">
    <div class="field">
        <label>Name <input  th:field ="*{name}"></label>
        <span th:if="${#fields.hasErrors('name')}" th:errors ="*{name}"></span>
    </div>
    <div class="field">
        <label>Slug <input  th:field ="*{slug}"></label>
        <span th:if="${#fields.hasErrors('slug')}" th:errors ="*{slug}"></span>
    </div>
    <div class="field">
        <label>Active <input type="checkbox" th:field ="*{active}"></label>
    </div>
    <button type="submit">Save brand</button>
</form>
<a  th:href="@{/brands}">Back to brands</a>


</body>
</html>
